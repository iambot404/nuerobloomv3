<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DocHub - Next-Gen AI Educational Assessment & Learning Disability Screening Platform inspired by Google Antigravity.">
    <title>{% block title %}DocHub | Next-Gen AI Learning Assessment{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Antigravity Design System -->
    <link rel="stylesheet" href="{{ url_for('static', filename='antigravity.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="ambient-glow-canvas"></div>
    <canvas id="particleCanvas"></canvas>

    {% block content %}{% endblock %}

    <!-- Antigravity Interactive Engine -->
    <script src="{{ url_for('static', filename='antigravity.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
